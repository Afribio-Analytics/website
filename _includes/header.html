<header class="site-header">
  <div class="wrap site-header__in">
    <a class="brand" href="{{ '/' | relative_url }}">
      {% include logo.html %}
      <span class="brand__name">Afribio<br>Analytics</span>
    </a>
    <nav class="nav">
      {% for item in site.data.navigation %}
      <a class="nav__link{% if page.url == item.url %} is-active{% endif %}" href="{{ item.url | relative_url }}">{{ item.title }}</a>
      {% endfor %}
      <a class="btn btn--sm" href="{{ '/contact/' | relative_url }}">Contact →</a>
    </nav>
  </div>
</header>
